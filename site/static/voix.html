<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choix de la voix</title>
<style>
:root{--paper:#f2f5f4;--card:#fff;--ink:#15242b;--muted:#5b6b72;--line:#d6dedc;--jjok:#1d5a78}
@media (prefers-color-scheme:dark){:root{--paper:#0f181c;--card:#18242a;--ink:#e8efee;--muted:#93a4aa;--line:#2a3a41;--jjok:#7dc0df;color-scheme:dark}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;margin:0} p{margin:0;color:var(--muted)}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
h2{font-size:17px;margin:0;color:var(--jjok)} .ko{font-size:17px;color:var(--ink)} audio{width:100%}
small{color:var(--muted)}
</style></head><body><main>
<h1>Choix de la voix</h1>
<p>Écoute la même phrase avec chaque voix, puis dis à Claude laquelle tu préfères. Toutes les histoires et les cartes seront enregistrées avec celle-là.</p>
<div id="list"><p>Chargement des échantillons…</p></div>
</main>
<script>
fetch("voix/manifest.json",{cache:"no-store"}).then(r=>r.json()).then(m=>{
  const names={mot:"Un mot",phrase:"Une phrase de carte",histoire:"Un passage d'histoire"};
  document.getElementById("list").innerHTML=m.voices.length?m.voices.map(v=>`<section><h2>${v.label}</h2>${v.files.map((f,i)=>`<div><small>${names[m.texts[i].id]}</small><div class="ko">${m.texts[i].ko}</div><audio controls preload="none" src="voix/${f}"></audio></div>`).join("")}</section>`).join(""):"<p>Aucun échantillon n'a pu être généré.</p>";
  document.getElementById("list").style.cssText="display:flex;flex-direction:column;gap:18px";
}).catch(()=>{document.getElementById("list").innerHTML="<p>Les échantillons ne sont pas encore disponibles. Réessaie dans quelques minutes.</p>"});
</script></body></html>
