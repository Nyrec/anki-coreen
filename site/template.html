<style>
/* Layout : carnet de révision, une colonne lisible, barre d'onglets en bas (téléphone) ou rail à gauche (tablette). */
:root{
  --paper:#f7f7f5; --card:#ffffff; --ink:#1b1c20; --muted:#646770; --line:#e3e4e8;
  --jjok:#0047a0; --jjok-soft:#e3ecf8; --chija:#e9a20f;
  --a1:#16936a; --a2:#2d6ce0; --b1:#8a4fd6;
  --sd:linear-gradient(90deg,#cd2e3a 0 50%,#0047a0 50%); --tg:#cd2e3a; --tb:#0047a0;
  --ko:"Gowun Batang","Apple SD Gothic Neo","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16171b; --card:#202228; --ink:#f1f2f5; --muted:#a3a7b2; --line:#33363f;
  --jjok:#6f9dff; --jjok-soft:#1f2b45; --chija:#ffc53d; --a1:#3fd29a; --a2:#79a9ff; --b1:#c193ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16171b; --card:#202228; --ink:#f1f2f5; --muted:#a3a7b2; --line:#33363f;
  --jjok:#6f9dff; --jjok-soft:#1f2b45; --chija:#ffc53d; --a1:#3fd29a; --a2:#79a9ff; --b1:#c193ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--chija);outline-offset:2px}
.ko{font-family:var(--ko)}
#app{display:flex;flex-direction:column;height:100%}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px}
nav.tabs{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:11px}
nav.tabs button b{font-family:var(--ko);font-size:17px;font-weight:700}
nav.tabs button[aria-current="page"]{color:var(--jjok)}
@media (min-width:820px){
  #app{flex-direction:row-reverse}
  nav.tabs{flex-direction:column;border-top:0;border-right:1px solid var(--line);width:104px;padding-top:16px;gap:6px}
  nav.tabs button{flex:0;padding:12px 4px;font-size:12px}
  nav.tabs button b{font-size:21px}
  .wrap{padding-top:32px}
}
h1{font-family:var(--ko);font-size:30px;line-height:1.2;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:14px;font-weight:400;color:var(--muted);margin-top:4px}
h2{font-size:15px;font-weight:600;letter-spacing:0;color:var(--ink);margin:0}
section{display:flex;flex-direction:column;gap:10px}
.back{align-self:flex-start;border:0;background:none;padding:4px 0;color:var(--jjok);font-weight:500}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:76px}
.tile .ko{font-size:19px;font-weight:700}
.tile span{font-size:13px;color:var(--muted)}
.tile em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:auto}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.rowbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.rows>:last-child{border-bottom:0}
.rowbtn .id{font-family:var(--ko);font-weight:700;min-width:44px;color:var(--jjok)}
.rowbtn .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.rowbtn .tx small{color:var(--muted);font-size:13px}
.rowbtn .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lvl{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid currentColor;line-height:1.5}
.lvl.A1{color:var(--a1)} .lvl.A2{color:var(--a2)} .lvl.B1,.lvl.B2{color:var(--b1)}
.level{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-left:5px solid var(--c);background:var(--card);border-radius:12px;text-align:left}
.level strong{font-size:17px}
.level span{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--jjok);border-color:var(--jjok);color:var(--paper)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--jjok);background:var(--jjok);color:var(--paper);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--jjok)}
.btn.warn{border-color:var(--chija);background:none;color:var(--ink)}
details.w{border-bottom:1px solid var(--line)}
details.w summary{list-style:none;display:flex;align-items:baseline;gap:10px;padding:11px 14px;cursor:pointer}
details.w summary::-webkit-details-marker{display:none}
details.w summary .k{font-family:var(--ko);font-size:19px;font-weight:700;flex:0 1 auto}
details.w summary .e{flex:1;min-width:0;color:var(--muted);font-size:14px;text-align:right}
details.w.known summary .k::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--a1);margin-left:7px;vertical-align:middle}
.body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.body .fr{font-style:italic}
.body .ex{border-left:3px solid var(--jjok-soft);padding-left:10px}
.body .ex .ko{font-size:17px}
.body .ex span{display:block;color:var(--muted);font-size:14px}
.body .note{color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mini{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:13px}
.count{font-size:13px;color:var(--muted)}
.study{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.flash{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:28px 18px;min-height:280px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}
.flash .big{font-family:var(--ko);font-size:38px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.flash .big.small{font-size:24px}
.flash .ans{font-size:19px}
.flash .hint{color:var(--muted);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;text-align:left;font-size:16px}
.opt.good{border-color:var(--a1);box-shadow:inset 0 0 0 1px var(--a1)}
.opt.bad{border-color:#c0443a;box-shadow:inset 0 0 0 1px #c0443a}
table.f{width:100%;border-collapse:collapse;font-size:15px}
table.f td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.f tr:last-child td{border-bottom:0}
table.f td.k{font-family:var(--ko);font-size:18px;font-weight:700;width:38%}
table.f td small{display:block;color:var(--muted);font-size:13px}
table.f td .x{display:block;font-family:var(--ko);font-size:14px;color:var(--jjok);margin-top:2px}
.tablebox{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow-x:auto}
.intro{color:var(--muted);max-width:62ch;margin:0}
.story p{margin:0}
.line{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.line .s{font-family:var(--ko);font-size:21px;line-height:1.7}
.line .s span{border-radius:4px;cursor:pointer}
.line .s span.on{background:var(--jjok-soft)}
.line .tr{font-size:14px;color:var(--muted)}
.line .tr b{font-weight:400;color:var(--ink);display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--jjok);padding:14px 16px 18px;max-height:46%;overflow-y:auto;box-shadow:0 -8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px;z-index:5}
.sheet .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sheet .k{font-family:var(--ko);font-size:22px;font-weight:700}
.empty{color:var(--muted);padding:14px}
.panel[hidden],[hidden]{display:none!important}
.msg{margin:0;font-weight:600;color:var(--red)}.msg:empty{display:none}
.syncrow{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}.syncrow .panel{flex-basis:100%}
.fld{font:inherit;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.hero{position:relative;overflow:hidden}
.hero::after{content:"한";position:absolute;right:-14px;bottom:-58px;font:700 210px var(--ko);color:#fff;opacity:.07;pointer-events:none;line-height:1}
.hero>*{position:relative;z-index:1}
.hero .btn.big{box-shadow:0 10px 22px -12px rgba(0,0,0,.6)}
h2::before{content:"";display:inline-block;width:13px;height:13px;border-radius:50%;background:conic-gradient(from 123.7deg,#cd2e3a 0 50%,#0047a0 50%);margin-right:9px;vertical-align:-1px;flex:none}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cover{position:relative;overflow:hidden;border:0;border-radius:18px;padding:14px;min-height:132px;display:flex;flex-direction:column;gap:6px;text-align:left;color:#fff;background:linear-gradient(145deg,var(--cv),color-mix(in srgb,var(--cv) 55%,#0a1418));box-shadow:0 14px 24px -18px var(--cv);transition:transform .12s ease}
.cover.lv-A1{--cv:var(--grn)}.cover.lv-A2{--cv:var(--blu)}.cover.lv-B1,.cover.lv-B2{--cv:var(--vio)}
.cover .id{position:absolute;right:8px;top:-8px;font:700 64px var(--ko);opacity:.16;color:#fff}
.cover .tx{display:flex;flex-direction:column;gap:2px;position:relative}.cover .tx .ko{font-size:20px!important;line-height:1.3}
.cover .tx small{color:#fff;opacity:.85;font-size:13px}
.cover .n{margin-top:auto;font-size:12px;color:#fff;opacity:.92}.cover .n b.due{color:#fff;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:99px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.cover:active{transform:scale(.97)}}
.flash .tag.lvband{align-self:center;padding:3px 12px;border-radius:99px;background:color-mix(in srgb,var(--lc) 14%,transparent);color:var(--lc)}
.lvband.A1{--lc:var(--a1)}.lvband.A2{--lc:var(--a2)}.lvband.B1,.lvband.B2{--lc:var(--b1)}
.flash{border:0;background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--jjok) 5%,var(--card)))}

/* ---------- liste de cartes ---------- */
function deckCards(s){
  if(s.kind==="theme")return themeCards(s.key);
  if(s.kind==="course"){const cs=CARDS.filter(c=>c.c===s.id);return s.id==="jour"?cs.slice().reverse():cs.filter(c=>c.p==="gram").concat(cs.filter(c=>c.p!=="gram"))}
  if(s.kind==="level")return CARDS.filter(c=>lvKey(c)===s.key);
  if(s.kind==="review")return CARDS.filter(c=>!known.has(c.k));
  if(s.kind==="search"){const q=s.q.toLowerCase();return CARDS.filter(c=>c.k.includes(s.q)||c.e.toLowerCase().includes(q)||(c.f||"").toLowerCase().includes(q)||(c.x||"").includes(s.q))}
  return CARDS;
}
function deckTitle(s){
  if(s.kind==="theme"){for(const g of THEMES)for(const it of g.items)if(it[0]===s.key)return [it[2],it[1]];}
  if(s.kind==="course"){const c=courseOf(s.id);return [s.id==="jour"?"매일 단어":s.id==="moi"?"내 일기 · Mon journal":s.id,c.t+(c.s?" · "+c.s:"")]}
  if(s.kind==="level"){const l=LV.find(x=>x[0]===s.key);return [l[2],l[1]+" · niveau estimé d'après le manuel du cours"]}
  if(s.kind==="review")return ["새 단어","Cartes pas encore apprises"];
  if(s.kind==="search")return ["« "+s.q+" »","Résultats de la recherche"];
  return ["전체","Toutes les cartes"];
}
function filtered(s){let cs=deckCards(s);if(s.fl)cs=cs.filter(c=>lvKey(c)===s.fl);if(s.fp)cs=cs.filter(c=>c.p===s.fp);if(s.fu)cs=cs.filter(c=>!known.has(c.k));return cs}
function cardBody(c){
  const co=courseOf(c.c);
  return `<div class="body">
   ${c.e?`<div>${esc(c.e)}</div>`:""}${c.f?`<div class="fr">${esc(c.f)}</div>`:""}
   ${c.x?`<div class="ex"><div class="ko">${esc(c.x)}</div>${c.y?`<span>${esc(c.y)}</span>`:""}${c.z?`<span>${esc(c.z)}</span>`:""}</div>`:""}
   ${c.n?`<div class="note">${esc(c.n)}</div>`:""}
   <div class="meta"><span class="lvl ${c.l}">${c.l}</span><button class="mini" data-course="${c.c}">${courseLabel(c.c)}${c.d?" · "+c.d.slice(5):""}</button>
   ${canPlay?`${spoken(c.k)?`<button class="mini" data-say="${esc(c.k)}">단어 듣기 · Écouter le mot</button>`:""}${c.x?`<button class="mini" data-say="${esc(c.x)}">문장 듣기 · Écouter la phrase</button>`:""}`:""}
   <button class="mini" data-node="m:${esc(c.k)}">뇌 · Liens</button><button class="mini" data-known="${esc(c.k)}">${known.has(c.k)?"Remettre à zéro":"Je connais déjà"}</button>${S.c[c.k]?`<span class="count">${S.c[c.k][1]===0?"en apprentissage":"prochaine révision dans "+fmtIvl(Math.max(1,S.c[c.k][0]-today()))}</span>`:""}</div></div>`;
}
function vDeck(s){
  const all=deckCards(s),[ko,fr]=deckTitle(s),cs=filtered(s),dst=stats(cs);s.limit=s.limit||120;
  const lv=new Set(all.map(lvKey)),ps=new Set(all.map(c=>c.p));
  const fiche=s.kind==="theme"?FICHES.find(f=>f.themes.includes(s.key)):null;
  const chip=(lab,on,attr)=>`<button class="chip" aria-pressed="${on}" ${attr}>${lab}</button>`;
  $("#view").innerHTML=`${backBtn()}<h1>${esc(ko)}<small>${esc(fr)}</small></h1>
  ${all.length?`<div class="actions"><button class="btn" data-act="study">복습 · Réviser</button><button class="btn ghost" data-act="quiz">퀴즈 · Quiz</button>${fiche?`<button class="btn warn" data-fiche="${fiche.id}">Fiche : ${fiche.t}</button>`:""}${s.kind==="course"||s.kind==="theme"?`<button class="btn ghost" data-node="${s.kind==="course"?"c:"+esc(s.id):"t:"+esc(s.key)}">뇌 · Réseau</button>`:""}</div>`:""}
  ${lv.size>1?`<div class="chips">${chip("전체 · Tout",!s.fl,'data-fl=""')}${LV.filter(l=>lv.has(l[0])).map(l=>chip(l[2],s.fl===l[0],`data-fl="${l[0]}"`)).join("")}</div>`:""}
  ${ps.size>1?`<div class="chips">${chip("전체 · Tout",!s.fp,'data-fp=""')}${Object.keys(POSN).filter(p=>ps.has(p)).map(p=>chip(POSN[p],s.fp===p,`data-fp="${p}"`)).join("")}</div>`:""}
  <div class="chips">${chip("Masquer les cartes déjà apprises",!!s.fu,'data-fu="1"')}${dst.nw?`<button class="chip" data-act="bulk">${s.bulk?`Confirmer : ${dst.nw} cartes passent en « déjà connues »`:"Je connais déjà toute cette liste"}</button>`:""}</div>
  <p class="count">${cs.length} carte${cs.length>1?"s":""} : ${dst.due} à revoir, ${dst.nw} nouvelles, ${dst.mature} matures. Touche un mot pour voir l'exemple et la note.</p>
  <div class="rows">${cs.length?cs.slice(0,s.limit).map(c=>`<details class="w${known.has(c.k)?" known":""}" data-k="${esc(c.k)}"><summary><span class="k">${esc(c.k)}</span><span class="e">${biH(c)}</span></summary></details>`).join(""):'<div class="empty">Aucune carte ne correspond à ces filtres.</div>'}</div>
  ${cs.length>s.limit?`<button class="btn ghost" data-act="more">Afficher la suite (${cs.length-s.limit} restantes)</button>`:""}`;
}
document.addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("details.w")&&d.open&&!d.querySelector(".body")){const c=CARDS.find(x=>x.k===d.dataset.k);if(c)d.insertAdjacentHTML("beforeend",cardBody(c))}},true);

/* ---------- révision ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function vStudy(s){
  if(!s.queue){s.queue=buildSession(s.cards,s.extra,s.recent);s.done=0;s.rev=false;s.spoken=null}
  const left=stats(s.cards);
  if(!s.queue.length){
    if(s.done&&!s.synced&&OFFLINE&&SY){s.synced=1;doSync(true)}
    $("#view").innerHTML=`${backBtn()}<h1 class="fin">${s.done?"수고했어요! · Bien travaillé !":"없어요 · Il n'y en a pas"}<small>${s.done?`${s.done} carte${s.done>1?"s":""} révisée${s.done>1?"s":""} dans cette série.`:"Aucune carte à réviser ici pour aujourd'hui."}</small></h1>
    <p class="intro">${left.nw?`Il reste ${left.nw} nouvelles cartes dans cette liste. La limite du jour est de ${S.cfg.nw}.`:"Toutes les cartes de cette liste ont déjà été vues."}</p>
    <div class="actions">${left.nw?`<button class="btn" data-act="more-new">Apprendre 10 nouvelles cartes de plus</button>`:""}<button class="btn ghost" data-act="back">Revenir</button></div>`;return}
  const c=CARDIDX[s.queue[0]],cs=S.c[c.k];
  // Sens automatique : reconnaissance d'abord, puis production (traduction → coréen) une fois sur deux quand la carte est acquise.
  // Sens automatique : reconnaissance, puis production (traduction → coréen) et écoute seule quand la carte est acquise.
  // Rappel libre, cartes acquises (intervalle ≥ 3 j) : on fait tourner les formes de rappel pour que le mot soit utilisable,
  // pas seulement reconnu : coréen → sens, phrase à trou (le mot dans son contexte), écrire le mot en coréen (≥ 7 j), écoute seule.
  const earOK=canPlay&&sndMode()!=="off"&&!!spoken(c.k),clz=clozeOf(c),wOK=canWrite(c);
  let dir="";
  if(s.dir==="ko")dir="";else if(s.dir==="fr")dir=wOK?"write":"fr";else if(s.dir==="ear")dir=earOK?"ear":"";else if(s.dir==="ctx")dir=clz?"ctx":"";
  else if(cs&&cs[1]>=3){const modes=[""];if(clz)modes.push("ctx");if(cs[1]>=7)modes.push(wOK?"write":c.p!=="gram"?"fr":"");if(earOK)modes.push("ear");dir=modes[cs[3]%modes.length]}
  const front=dir==="fr"?biH(c):dir==="ear"||dir==="ctx"?"":esc(c.k);
  const qn=s.queue.filter(k=>!S.c[k]).length,ql=s.queue.filter(k=>S.c[k]&&S.c[k][1]===0).length,qr=s.queue.length-qn-ql;
  const head=`${backBtn()}<div class="study"><div class="meta"><span class="qc"><b style="color:var(--jjok)">${qn}</b> 새 카드 · <b style="color:var(--chija)">${ql}</b> 배우는 중 · <b style="color:var(--a1)">${qr}</b> 복습<br>nouvelles · en apprentissage · révisions</span><button class="mini" data-act="dir">${s.dir==="fr"?"번역 → 한국어 · Traduction → coréen":s.dir==="ko"?"한국어 → 번역 · Coréen → traduction":s.dir==="ear"?"듣기 → 뜻 · Écoute → sens":s.dir==="ctx"?"빈칸 · Phrase à trou":"방향 : 자동 · Sens : automatique"}</button>${canPlay?`<button class="mini snd ${sndMode()}" data-act="snd">${SND[sndMode()]}</button>`:""}${s.last?`<button class="mini" data-act="undo">되돌리기 · Annuler</button>`:""}</div>
  <div class="bar sess" style="--c:var(--a1)"><i style="width:${s.done+s.queue.length?Math.round(100*s.done/(s.done+s.queue.length)):0}%"></i></div>`;
  const listen=(word,ex)=>canPlay?`<div class="actions center">${word&&spoken(c.k)?`<button class="mini" data-say="${esc(c.k)}">단어 듣기 · Écouter le mot</button>`:""}${ex&&c.x?`<button class="mini" data-say="${esc(c.x)}">문장 듣기 · Écouter la phrase</button>`:""}</div>`:"";
  const backSide=()=>`<div class="ans">${esc(c.f||c.e)}${c.f&&c.e&&c.f!==c.e?`<small>${esc(c.e)}</small>`:""}</div>${c.x?`<div class="ko exx">${esc(c.x)}</div><div class="hint">${esc(c.z||c.y||"")}</div>`:""}${c.n?`<div class="hint">${esc(c.n)}</div>`:""}`;
  const stg=stage(c.k);
  // 1) Découverte : un mot jamais vu n'est pas un test. On montre tout, on écoute, on répète à voix haute.
  if(stg<0){
    s.mq=null;if(!s.t0||s.tk!==c.k){s.t0=Date.now();s.tk=c.k}
    $("#view").innerHTML=`${head}<div class="flash"><span class="tag lvband ${c.l}">처음 보는 단어 · Nouveau mot · ${courseLabel(c.c)} · ${c.l}</span><div class="big ko${c.k.length>9?" small":""}">${esc(c.k)}</div><hr>${backSide()}</div>
    ${listen(true,true)}
    <button class="btn big" data-act="intro-ok">알겠어요 · Compris, suivant</button>
    <p class="count keys">Lis la carte, écoute et répète le mot à voix haute. Il revient tout de suite en QCM, puis demain. Au clavier : Espace.</p></div>`;
    if(canPlay&&sndMode()!=="off"&&s.spoken!==c.k+"|i"){s.spoken=c.k+"|i";sayCard(c)}
    return}
  // 2) QCM à 4 choix : reconnaître avant de devoir retrouver de mémoire.
  if(stg<2){
    if(!s.mq||s.mq.k!==c.k){const opts=mcqOpts(c,s.cards);s.mq=opts?{k:c.k,opts,pick:null,fr:s.dir==="fr"}:{k:c.k,none:1};s.t0=Date.now()}
    const q=s.mq;
    if(!q.none){const picked=q.pick!=null,good=picked&&q.opts[q.pick].k===c.k;
      $("#view").innerHTML=`${head}<div class="flash" style="min-height:170px"><span class="tag lvband ${c.l}">퀴즈 · QCM ${stg+1} / 2 · ${courseLabel(c.c)} · ${c.l}</span><div class="big${q.fr?"":" ko"}${q.fr||c.k.length>9?" small":""}">${q.fr?biH(c):esc(c.k)}</div>
      ${picked?`<hr><div class="hint" style="font-weight:600;color:${good?"var(--a1)":"#c0443a"}">${good?"맞아요! · Bonne réponse":"아쉬워요 · Ce n'était pas ça, il revient dans cette série"}</div>${q.fr?`<div class="big ko small">${esc(c.k)}</div>`:""}${c.x?`<div class="ko exx">${esc(c.x)}</div><div class="hint">${esc(c.z||c.y||"")}</div>`:""}`:`<div class="hint">${q.fr?"Choisis le mot coréen":"Choisis la bonne traduction"}</div>`}</div>
      ${q.opts.map((o,j)=>`<button class="opt${picked?(o.k===c.k?" good":j===q.pick?" bad":""):""}" data-mq="${j}" ${picked?"disabled":""}><span class="count" style="margin-right:6px">${j+1}</span>${q.fr?`<span class="ko">${esc(o.k)}</span>`:biH(o)}</button>`).join("")}
      ${picked?listen(true,true)+`<button class="btn big" data-act="mcq-next">다음 · Suivant</button>`:""}
      <p class="count keys">Au clavier : 1 à 4 pour choisir, puis Espace. R pour réécouter, Z pour annuler.</p></div>`;
      if(canPlay&&sndMode()!=="off"&&!q.fr&&s.spoken!==c.k+"|q"){s.spoken=c.k+"|q";sayCard(c)}
      if(canPlay&&sndMode()!=="off"&&picked&&s.spoken!==c.k+"|qa"){s.spoken=c.k+"|qa";if(q.fr||sndMode()==="back")sayCard(c)}
      return}
  }
  // 3) Rappel libre : retrouver le sens (ou le mot coréen) de mémoire, puis dire honnêtement si on savait.
  const tagR=`<span class="tag lvband ${c.l}">${cs&&cs[1]===0?"배우는 중 · En apprentissage":"복습 · Révision"} · ${courseLabel(c.c)} · ${c.l}</span>`;
  const gradesHTML=sug=>`<div class="grades two"><button class="grade g1${sug===1?" sugg":""}" data-grade="1"><small>revient dans cette série</small><span class="ko">몰랐어요</span>Je ne savais pas</button><button class="grade g3${sug===3?" sugg":""}" data-grade="3"><small>revient dans ${fmtIvl(nextIvl(cs,3))}</small><span class="ko">알았어요</span>${sug===3&&s.tw&&!s.tw.ok?"J'avais juste":"Je savais"}</button></div>`;
  // 3a) Écrire le mot en coréen : la production la plus proche de « parler », corrigée automatiquement.
  if(dir==="write"){
    if(!s.tw||s.tw.k!==c.k){s.tw={k:c.k,ans:"",ok:null};s.rev=false;s.t0=Date.now()}
    const w=s.tw,done=w.ok!=null,alt=exAlts(c)[0];
    $("#view").innerHTML=`${head}<div class="flash">${tagR}<div class="big small">${biH(c)}</div>
    ${done?`<div class="hint" style="font-weight:600;color:${w.ok?"var(--a1)":"var(--red)"}">${w.ok?"맞아요 · Juste":w.sim>=70?"거의 · Presque":"틀렸어요 · Faux"}</div>${w.ok?`<div class="big ko small">${esc(c.k)}</div>`:`<div class="dres" style="margin-top:6px"><small>정답 · La bonne réponse</small><p class="ko big2">${markText(alt,lcs(hang(alt),hang(w.ans)).ma)}</p><small>내 답 · Ta réponse</small><p class="ko">${w.ans.trim()?markText(w.ans,lcs(hang(alt),hang(w.ans)).mb):"—"}</p></div>`}${c.x?`<div class="ko exx">${esc(c.x)}</div><div class="hint">${esc(c.z||c.y||"")}</div>`:""}`:`<div class="hint">한국어로 쓰세요 · Écris le mot en coréen</div>`}</div>
    <input id="twq" class="ko dq" placeholder="한국어로 쓰세요" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(w.ans)}" ${done?"disabled":""}>
    ${done?listen(true,true)+gradesHTML(w.ok?3:1)+`<p class="count keys">${w.ok?"":"Faute de frappe ou autre forme correcte ? Choisis « J'avais juste ». "}Espace pour valider le choix en surbrillance.</p>`:`<div class="actions"><button class="btn big" data-act="twcheck">확인 · Vérifier</button><button class="btn ghost" data-act="twskip">모르겠어요 · Je ne sais pas</button></div><p class="count keys">Entrée pour vérifier. Il te faut le clavier coréen.</p>`}</div>`;
    if(!done){const i=$("#twq");setTimeout(()=>{try{i.focus()}catch(e){}},60);i.oninput=()=>{w.ans=i.value};i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();document.querySelector('[data-act="twcheck"]').click()}}}
    else if(canPlay&&sndMode()!=="off"&&s.spoken!==c.k+"|w"){s.spoken=c.k+"|w";sayCard(c)}
    return}
  // 3b) Phrase à trou : retrouver le mot dans une vraie phrase, avec sa construction.
  if(dir==="ctx"){
    if(!s.rev){s.t0=Date.now()}
    $("#view").innerHTML=`${head}<div class="flash" data-act="flip" role="button" tabindex="0">${tagR}
    <div class="ko cz">${esc(clz.pre)}${s.rev?`<mark>${esc(clz.mid)}</mark>`:`<span class="blank">${"＿".repeat(Math.max(2,clz.mid.length))}</span>`}${esc(clz.post)}</div>
    <div class="hint">${esc(c.z||c.y||"")}</div>
    ${s.rev?`<hr><div class="big ko small">${esc(c.k)}</div><div class="ans">${biH(c)}</div>${c.n?`<div class="hint">${esc(c.n)}</div>`:""}`:`<div class="hint">빈칸에 들어갈 말은? · Quel mot manque ? Dis la phrase entière à voix haute.</div>`}</div>
    ${s.rev?listen(true,true)+gradesHTML(0):`<button class="btn big" data-act="flip">답 보기 · Voir la réponse</button>`}
    <p class="count keys">${s.rev?"→ ou Espace si tu savais, ← sinon.":"Espace pour voir la réponse."}</p></div>`;
    if(s.rev&&canPlay&&sndMode()!=="off"&&s.spoken!==c.k+"|cz"){s.spoken=c.k+"|cz";speak(c.x)}
    return}
  if(!s.rev){s.t0=Date.now()}
  $("#view").innerHTML=`${head}
  <div class="flash" data-act="flip" role="button" tabindex="0"><span class="tag lvband ${c.l}">${!cs?"새 카드 · Nouvelle carte":cs[1]===0?"배우는 중 · En apprentissage":"복습 · Révision"} · ${courseLabel(c.c)} · ${c.l}</span>${dir==="ear"&&!s.rev?`<button class="earbtn" data-say="${esc(c.k)}" aria-label="Réécouter">🔊</button><div class="hint">듣고 뜻을 떠올려 보세요 · Écoute et retrouve le sens</div>`:`<div class="big${dir==="fr"||c.k.length>9?" small":""}${dir==="fr"?"":" ko"}">${dir==="ear"?esc(c.k):front}</div>`}
  ${s.rev?`${dir==="ear"?"":"<hr>"}${dir==="fr"?`<div class="big ko small">${esc(c.k)}</div>`:`<div class="ans">${esc(c.f||c.e)}${c.f?`<small>${esc(c.e)}</small>`:""}</div>`}${c.x?`<div class="ko exx">${esc(c.x)}</div><div class="hint">${esc(c.z||c.y||"")}</div>`:""}${c.n?`<div class="hint">${esc(c.n)}</div>`:""}`:`<div class="hint">Touche la carte pour voir la réponse</div>`}</div>
  ${canPlay?`<div class="actions center">${spoken(c.k)&&(s.rev||dir!=="fr")?`<button class="mini" data-say="${esc(c.k)}">단어 듣기 · Écouter le mot</button>`:""}${s.rev&&c.x?`<button class="mini" data-say="${esc(c.x)}">문장 듣기 · Écouter la phrase</button>`:""}</div>`:""}

const HEADS=CARDS.filter(c=>c.p!=="gram"&&!/[?\s\/(]/.test(c.k)).map(c=>({c,stem:c.k.replace(/하다$/,"").replace(/다$/,"")})).filter(h=>h.stem.length>=1);
function lookup(w){
  w=w.replace(/[^가-힣]/g,"");if(!w)return [];
  const out=[];const exact=CARDS.filter(c=>c.k===w);out.push(...exact);
  let best=0;const pre=[];
  for(const h of HEADS){const st=h.stem;if(st.length<2&&!(w.length<=st.length+2))continue;if(w.startsWith(st)){if(st.length>best){best=st.length;pre.length=0}if(st.length===best)pre.push(h.c)}}
  if(best>=2||(best===1&&w.length<=3))for(const c of pre)if(!out.includes(c))out.push(c);
  return out.slice(0,4);
}
function storyVoc(){const s=cur();const st=s.v==="story"?STORIES.find(x=>x.id===s.id):null;return (st&&st.voc)||[]}
function wordGloss(w){const r=lookup(w);if(r.length)return [r[0].k,biT(r[0])];const c=w.replace(/[^가-힣]/g,"");if(!c)return null;
  let best=null,bl=0;for(const v of storyVoc()){const k=v[0].replace(/\(.*?\)/g,"").split("/")[0].trim(),st=k.replace(/하다$/,"").replace(/다$/,"");if(st.length>bl&&c.startsWith(st)){best=v;bl=st.length}}return best?[best[0],best[1]+(best[2]?" · "+best[2]:"")]:null}
