name: Échantillons de voix
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Voix Microsoft
        run: |
          pip install -q edge-tts
          python site/voices_sample.py edge
      - name: Voix open source (MeloTTS)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download
          python site/voices_sample.py melo
      - name: Enregistrer les échantillons
        run: |
          git config user.name "anki-coreen"
          git config user.email "actions@users.noreply.github.com"
          git add site/static/voix
          git diff --cached --quiet || (git commit -m "Échantillons de voix [skip ci]" && git push)
      - name: Construire le site
        run: python site/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: voix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
